[ids]

*


[main]

capslock = overloadt(capslock, `, 310)
# ` = S-`

# -- Workarounds for my broken ctrl keys --
` = layer(control)
rightalt = layer(control)
# --

playpause = home
stopcd = end
previoussong = pageup
nextsong = pagedown

favorites = insert

numlock = timeout(calc, 200, numlock)

# ln -s /usr/share/keyd/keyd.compose ~/.XCompose
# kpslash = Ŧ
# kpasterisk = Ł

[meta]
# TODO: this section does not currently work!
kp1 = macro(M-kp4 M-kp2)
kp3 = macro(M-kp6 M-kp2)
kp7 = macro(M-kp4 M-kp8)
kp9 = macro(M-kp6 M-kp8)

[capslock]

j = left
i = up
k = down
l = right

u = pageup
o = pagedown

w = volumeup
s = volumedown
x = mute

a = playpause
d = nextsong

, = C-left
. = C-right

# -- Cursor keys as virtual mouse (see ~/.local/share/window-shortcuts/cursor.zsh) --
left = C-M-A-left
right = C-M-A-right
up = C-M-A-up
down = C-M-A-down

enter = C-M-A-enter
space = C-M-A-space
# TODO:  middle click?
# --

# -- Numpad as virtual mouse (see ~/.local/share/window-shortcuts/cursor.zsh) --
kp4 = macro(C-M-A-left)
kp6 = macro(C-M-A-right)
kp8 = macro(C-M-A-up)
kp2 = macro(C-M-A-down)

kp7 = macro(C-M-A-left C-M-A-up)
kp9 = macro(C-M-A-right C-M-A-up)
kp1 = macro(C-M-A-left C-M-A-down)
kp3 = macro(C-M-A-right C-M-A-down)

kp5 = C-M-A-enter
kpplus = C-M-A-space
kpenter = C-M-A-kpenter
# --

